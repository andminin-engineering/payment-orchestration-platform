name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: andminin-biz
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'andminin-engineering_payment-orchestration-platform' }}

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B -e clean verify

      - name: Print surefire reports on failure
        if: ${{ failure() }}
        run: |
          if ls target/surefire-reports/*.txt 1> /dev/null 2>&1; then
            cat target/surefire-reports/*.txt
          else
            echo "No surefire report files found."
          fi

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Sonar preflight (non-secret checks)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "SONAR_HOST_URL=${SONAR_HOST_URL}"
          echo "SONAR_ORGANIZATION=${SONAR_ORGANIZATION}"
          echo "SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY}"
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN is not configured in environment 'production'."
            exit 1
          fi

      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -e -X verify sonar:sonar \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.organization=${SONAR_ORGANIZATION} \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true
