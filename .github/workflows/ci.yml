name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B -e clean verify

      - name: Print surefire reports on failure
        if: ${{ failure() }}
        run: |
          if ls target/surefire-reports/*.txt 1> /dev/null 2>&1; then
            cat target/surefire-reports/*.txt
          else
            echo "No surefire report files found."
          fi

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=andminin-engineering
          -Dsonar.projectKey=andminin-engineering_payment-orchestration-platform
          -Dsonar.token=${SONAR_TOKEN}
